name: Release

# Мёрж в main только обновляет релизный PR. Мёрж этого PR выпускает релиз,
# и уже релиз уезжает на сервер. Ручной запуск деплоит любой релизный тег,
# например, чтобы откатиться.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_only:
        description: Publish candidate images without deploying
        type: boolean
        default: false
      tag:
        description: Release tag to deploy, e.g. v1.2.0. Empty deploys the newest main.
        required: false

# Деплои идут по одному, новый не прерывает уже начатую сборку.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  release:
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: aimuzov/.github/.github/workflows/release.yml@v1

  check:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/check.yml

  # Пока сервер не готов (ключ, клон в /srv, сайт в Caddy), деплой пропускается.
  # Включается переменной репозитория `DEPLOY_ENABLED=true`,
  # которой у самого infra-site-template нет.
  deploy:
    needs: [release, check, configure-api]
    # `!cancelled()`, а не `always()`: job идёт и при пропущенных release и check
    # (ручной запуск), но отменённый прогон не деплоит.
    if: >-
      !cancelled() && needs.configure-api.result == 'success' && vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_FROM_GHCR != 'true' && !inputs.build_only &&
      (github.event_name == 'workflow_dispatch' || needs.check.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://sorebody.aimuzov.online
    steps:
      - uses: aimuzov/infra-site-kit/deploy@v5
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          url: https://sorebody.aimuzov.online
          health-url: https://sorebody.aimuzov.online/api/health
          ref: ${{ needs.release.outputs.tag || inputs.tag }}

  build-site:
    needs: [release, check]
    if: >-
      !cancelled() && (inputs.build_only || (vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_FROM_GHCR == 'true' &&
      (needs.release.outputs.tag || inputs.tag) != '' && (github.event_name == 'workflow_dispatch' || needs.check.result
      == 'success')))
    permissions:
      contents: read
      packages: write
    uses: aimuzov/infra-ci/.github/workflows/build-image.yml@3e762ccf913fdea02f1e43312270c7a4a7e9d335
    with:
      ref: ${{ needs.release.outputs.tag || inputs.tag || github.sha }}
      image-suffix: '-site'
      dockerfile: deploy/frontend.Dockerfile
    secrets:
      build-env: |-
        PUBLIC_SENTRY_DSN=${{ vars.PUBLIC_SENTRY_DSN }}
        CHAT=${{ vars.CHAT }}

  build-api:
    needs: [release, check]
    if: >-
      !cancelled() && (inputs.build_only || (vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_FROM_GHCR == 'true' &&
      (needs.release.outputs.tag || inputs.tag) != '' && (github.event_name == 'workflow_dispatch' || needs.check.result
      == 'success')))
    permissions:
      contents: read
      packages: write
    uses: aimuzov/infra-ci/.github/workflows/build-image.yml@3e762ccf913fdea02f1e43312270c7a4a7e9d335
    with:
      ref: ${{ needs.release.outputs.tag || inputs.tag || github.sha }}
      image-suffix: '-api'
      dockerfile: deploy/backend.Dockerfile

  deploy-registry:
    needs: [release, build-site, build-api, configure-api]
    if: >-
      !cancelled() && !inputs.build_only && needs.configure-api.result == 'success' &&
      needs.build-site.result == 'success' && needs.build-api.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - id: request
        env:
          TAG: ${{ needs.release.outputs.tag || inputs.tag }}
          REVISION: ${{ needs.build-site.outputs.revision }}
          IMAGE_SITE: ${{ needs.build-site.outputs.image }}
          IMAGE_API: ${{ needs.build-api.outputs.image }}
          API_REVISION: ${{ needs.build-api.outputs.revision }}
        run: |
          [[ "$REVISION" == "$API_REVISION" ]]
          printf 'value=images %s %s %s\n' "$TAG" "$REVISION" "${IMAGE_SITE##*@} ${IMAGE_API##*@}" >> "$GITHUB_OUTPUT"
      - uses: aimuzov/infra-site-kit/deploy@v5
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          url: https://sorebody.aimuzov.online/
          health-url: https://sorebody.aimuzov.online/api/health
          ref: ${{ steps.request.outputs.value }}

  configure-api:
    needs: [release, check]
    if: >-
      !cancelled() && vars.DEPLOY_ENABLED == 'true' && !inputs.build_only &&
      (github.event_name == 'workflow_dispatch' || needs.check.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    steps:
      - name: Deliver API configuration
        env:
          SSH_KEY: ${{ secrets.API_CONFIG_SSH_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CHAT_ENABLED: ${{ vars.CHAT_ENABLED }}
          CHAT_MODEL: ${{ vars.CHAT_MODEL }}
          CHAT_ORIGINS: ${{ vars.CHAT_ORIGINS }}
          CHAT_PER_MINUTE: ${{ vars.CHAT_PER_MINUTE }}
          CHAT_PER_DAY: ${{ vars.CHAT_PER_DAY }}
          CHAT_DIALOGS_PER_DAY: ${{ vars.CHAT_DIALOGS_PER_DAY }}
          CHAT_DOLLARS_PER_DAY: ${{ vars.CHAT_DOLLARS_PER_DAY }}
        run: |
          set -euo pipefail
          umask 077
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/api-config' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/api-config
          printf '%s\n' '141.133.188.169 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINnRXayyFSNqYxBbGbHCh60Y6jUyhLT47gwSeoqQRvsd' > ~/.ssh/known_hosts
          python3 -c 'import json, os; print(json.dumps({key: os.environ[key] for key in (
            "OPENROUTER_API_KEY", "CHAT_ENABLED", "CHAT_MODEL", "CHAT_ORIGINS",
            "CHAT_PER_MINUTE", "CHAT_PER_DAY", "CHAT_DIALOGS_PER_DAY", "CHAT_DOLLARS_PER_DAY"
          )}))' | ssh -i ~/.ssh/api-config -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            root@141.133.188.169 configure-api
